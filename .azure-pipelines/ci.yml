trigger:
  - $(trigger)

pr: none

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
  - repository: azure-pipelines-templates
    type: github
    endpoint: ogcio
    name: ogcio/azure-pipelines-templates
    ref: refs/heads/develop

stages:
- stage: test
  displayName: Test
  jobs:
  - template: templates/python-bandit.yml@azure-pipelines-templates
    parameters:
        srcDir: irelandie_*


- stage: deploy
  displayName: Deploy
  jobs:
    - job: Deploy
      steps:
      - checkout: self
        submodules: true
        persistCredentials: true

      - task: Bash@3
        displayName: Run Terraform
        inputs:
          targetType: inline
          script: |
            cd infrastructure/terraform/aws/$(env)/
            terraform init -input=false -backend-config="access_key=$AWS_ACCESS_KEY_ID" -backend-config="secret_key=$AWS_SECRET_ACCESS_KEY"
            terraform apply -input=false -auto-approve
            cd ../../../..
          failOnStderr: true
        env:
          AWS_ACCESS_KEY_ID: $(aws_access_key)
          AWS_SECRET_ACCESS_KEY: $(aws_secret_key)
          AWS_DEFAULT_REGION: $(aws_region)

      - task: NodeTool@0
        displayName: Installing Node.js
        inputs:
          versionSpec: 14

      - task: Bash@3
        displayName: Build Static Files
        inputs:
          targetType: inline
          script: |
            npm install
            npm run build:prod

      - task: Bash@3
        displayName: Build and Push Image
        inputs:
          targetType: inline
          script: |
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
            docker build . -t "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG"
            docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG"
          failOnStderr: false
        env:
          AWS_ACCESS_KEY_ID: $(aws_access_key)
          AWS_SECRET_ACCESS_KEY: $(aws_secret_key)
          AWS_REGION: $(aws_region)
          AWS_ACCOUNT_ID: $(aws_account_id)
          IMAGE_NAME: $(image_name)
          IMAGE_TAG: $(image_tag)

      - task: Bash@3
        displayName: Upload Static Files to S3
        inputs:
          targetType: inline
          script: |
            docker run \
            -e "AWS_ACCESS_KEY_ID=$(AWS_ACCESS_KEY_ID)" \
            -e "AWS_SECRET_ACCESS_KEY=$(AWS_SECRET_ACCESS_KEY)" \
            -e "AWS_STATIC_BUCKET_NAME=$(AWS_STATIC_BUCKET_NAME)" \
            -e "USE_S3=1" \
            -e "SECRET_KEY=$(base64 /dev/urandom | head -c50)" \
            -e "ALLOWED_HOSTS=*" \
            -e "CORS_ALLOW_ALL_ORIGINS=True" \
            --entrypoint python3 "$(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com/$(IMAGE_NAME):$(IMAGE_TAG)" \
            manage.py collectstatic --noinput --clear
        env:
          AWS_ACCESS_KEY_ID: $(aws_access_key)
          AWS_SECRET_ACCESS_KEY: $(aws_secret_key)
          AWS_STATIC_BUCKET_NAME: $(aws_static_bucket_name)
          AWS_ACCOUNT_ID: $(aws_account_id)
          IMAGE_NAME: $(image_name)
          IMAGE_TAG: $(image_tag)

      - template: templates/ecs-update-service.yml
        parameters:
          clusterName: $(image_name)
          serviceName: $(image_name)
