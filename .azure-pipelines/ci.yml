trigger: none

pr: none

pool:
  vmImage: ubuntu-22.04

resources:
  repositories:
  - repository: azure-pipelines-templates
    type: github
    endpoint: ogcio
    name: ogcio/azure-pipelines-templates
    ref: refs/heads/develop

stages:
- stage: test
  displayName: Check the Code
  jobs:
  - job: Bandit
    displayName: Bandit (security checks)
    pool:
      vmImage: ubuntu-22.04
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.10'
    - script: |
        python -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip
        pip install --upgrade bandit
        bandit -r irelandie_* -x tests,migrations
      displayName: Install & Run Bandit
  - job: Lint
    steps:
    - script: |
        python -m pip install flake8
        flake8 .
      displayName: PEP8 Checks

  - job: Test
    steps:
    - script: pip install -r requirements.txt
      displayName: Install Requirements

    - script: |
        cat .azure-pipelines/.env_pipeline > app/.env
        python manage.py test
      displayName: Unit Tests

- stage: statics
  displayName: Static Files
  jobs:
  - job: StaticFiles
    steps:
    - task: NodeTool@0
      displayName: Installing Node.js
      inputs:
        versionSpec: 14

    - script: |
        npm install
        npm run build:prod
      displayName: Build Static Files

    - script: pip install -r requirements.txt
      displayName: Install Requirements

    - script: |
        cat .azure-pipelines/.env_pipeline > app/.env
        export USE_S3=1

        python manage.py collectstatic --noinput
      displayName: Upload Static Files to S3
      env:
        DEBUG: $(debug)
        OPENSEARCH_KEY: $(opensearch_key)
        OPENSEARCH_SECRET: $(opensearch_secret)
        AWS_ACCESS_KEY_ID: $(aws_access_key)
        AWS_SECRET_ACCESS_KEY: $(aws_secret_key)

- stage: terraform
  displayName: Terraform
  jobs:
    - job: runTerraform
      steps:
        - checkout: self
          submodules: true
          persistCredentials: true

        - task: Bash@3
          displayName: Build canary zip
          inputs:
            targetType: inline
            script: |
              set -euo pipefail

              test -f monitoring/canaries/index.py

              ZIP_NAME="site-health-canary.zip"
              rm -f "$ZIP_NAME"

              cd monitoring/canaries
              zip -r "../../$ZIP_NAME" .
              cd ../..

              echo "Built $ZIP_NAME"
              ls -lah "$ZIP_NAME"
              S3_KEY="canaries/site-health-canary.zip"

              aws s3 cp "$ZIP_NAME" "s3://${CANARY_BUCKET}/${S3_KEY}"

              CANARY_S3_VERSION=$(aws s3api head-object \
              --bucket "$CANARY_BUCKET" \
              --key "$S3_KEY" \
              --query VersionId \
              --output text)
              echo "##vso[task.setvariable variable=CANARY_S3_VERSION]$CANARY_S3_VERSION"
          env:
            AWS_ACCESS_KEY_ID: $(aws_access_key)
            AWS_SECRET_ACCESS_KEY: $(aws_secret_key)
            AWS_DEFAULT_REGION: $(aws_region)
            CANARY_BUCKET: $(canary_bucket)
        - task: Bash@3
          displayName: Run Terraform
          inputs:
            targetType: inline
            script: |
              cd infrastructure/terraform/aws/$(env)/
              terraform init -input=false -backend-config="access_key=$AWS_ACCESS_KEY_ID" -backend-config="secret_key=$AWS_SECRET_ACCESS_KEY"
              terraform apply -input=false -auto-approve -var="canary_code_s3_version=$(CANARY_S3_VERSION)"
              cd ../../../..
            failOnStderr: true
          env:
            AWS_ACCESS_KEY_ID: $(aws_access_key)
            AWS_SECRET_ACCESS_KEY: $(aws_secret_key)
            AWS_DEFAULT_REGION: $(aws_region)

- stage: deploy
  displayName: Deploy
  jobs:
  - job: Deploy
    steps:
    - checkout: self
      submodules: true
      persistCredentials: true
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.10'
    - script: |
         pip install --upgrade pip; pip install requests
    - script: |
          python release/schedule.py
      displayName: Run schedule.py
      condition: eq(variables['RELEASE_BUILD'], 'true')
    - task: Bash@3
      displayName: Build and Push Image
      inputs:
        targetType: inline
        script: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          CODEARTIFACT_REPO_URL=$(aws codeartifact get-repository-endpoint \
          --domain uat \
          --domain-owner 100350071169 \
          --repository python \
          --format pypi \
          --region "$AWS_REGION" \
          --query repositoryEndpoint \
          --output text)
          CODEARTIFACT_REPO_HOST="${CODEARTIFACT_REPO_URL#https://}"
          CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
            --domain uat \
            --domain-owner 100350071169 \
            --region "$AWS_REGION" \
            --query authorizationToken \
            --output text)
          
          docker build . \
            --build-arg CODEARTIFACT_REPO_HOST="$CODEARTIFACT_REPO_HOST" \
            --build-arg CODEARTIFACT_AUTH_TOKEN="$CODEARTIFACT_AUTH_TOKEN" \
            -t "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG"
          docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG"
        failOnStderr: false
      env:
        AWS_ACCESS_KEY_ID: $(aws_access_key)
        AWS_SECRET_ACCESS_KEY: $(aws_secret_key)
        AWS_REGION: $(aws_region)
        DEBUG: $(debug)
        OPENSEARCH_KEY: $(opensearch_key)
        OPENSEARCH_SECRET: $(opensearch_secret)
        AWS_ACCOUNT_ID: $(aws_account_id)
        IMAGE_NAME: $(image_name)
        IMAGE_TAG: $(image_tag)

    - template: templates/ecs-update-service.yml
  
      parameters:
        clusterName: $(image_name)
        serviceName: $(image_name)


  - job: DeployAPI
    steps:
      - template: templates/ecs-update-service.yml
        parameters:
          clusterName: $(image_name)
          serviceName: $(env)-api
          imageTag: $(image_tag)
          region: $(aws_region)