trigger: none

pr: none

pool:
  vmImage: ubuntu-22.04

resources:
  repositories:
  - repository: azure-pipelines-templates
    type: github
    endpoint: ogcio
    name: ogcio/azure-pipelines-templates
    ref: refs/heads/develop

stages:
- stage: test
  displayName: Check the Code
  jobs:
  - job: Bandit
    displayName: Bandit (security checks)
    pool:
      vmImage: ubuntu-22.04
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.10'
    - script: |
        python -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip
        pip install --upgrade bandit
        bandit -r irelandie_* -x tests,migrations
      displayName: Install & Run Bandit
  - job: Lint
    steps:
    - script: |
        python -m pip install flake8
        flake8 .
      displayName: PEP8 Checks

  - job: Test
    steps:
    - script: pip install -r requirements-test.txt
      displayName: Install Requirements

    - script: |
        cat .azure-pipelines/.env_pipeline > app/.env
        python manage.py test
      displayName: Unit Tests

- stage: statics
  displayName: Static Files
  jobs:
  - job: StaticFiles
    steps:
    - task: NodeTool@0
      displayName: Installing Node.js
      inputs:
        versionSpec: 14

    - script: |
        npm install
        npm run build:prod
      displayName: Build Static Files

    - script: |
       pip install -r requirements-test.txt
      displayName: Install Requirements

    - script: |
        cat .azure-pipelines/.env_pipeline > app/.env
        export USE_S3=1

        python manage.py collectstatic --noinput
      displayName: Upload Static Files to S3
      env:
        DEBUG: $(debug)
        OPENSEARCH_KEY: $(opensearch_key)
        OPENSEARCH_SECRET: $(opensearch_secret)
        AWS_ACCESS_KEY_ID: $(aws_access_key)
        AWS_SECRET_ACCESS_KEY: $(aws_secret_key)

- stage: terraform
  displayName: Terraform
  jobs:
    - job: runTerraform
      steps:
        - checkout: self
          submodules: true
          persistCredentials: true

        - task: Bash@3
          displayName: Build canary zip
          inputs:
            targetType: inline
            script: |
              set -euo pipefail

            #  ROOT="$(pwd)"
            #  SRC="${ROOT}/monitoring/canaries/index.py"
            #  BUILD="${ROOT}/_canary_build"
              
              
            #  ZIP_NAME="${ROOT}/site-health-canary.zip"
            #  S3_KEY="canaries/site-health-canary.zip"

            #  test -f "$SRC"

            #  rm -f "$ZIP_NAME"
            #  rm -rf "$BUILD"
            #  mkdir -p "$BUILD/python"

            #  cp "$SRC" "$BUILD/python/index.py"
            #  (cd "$BUILD" && zip -r "$ZIP_NAME" python)

            #  unzip -l "$ZIP_NAME"

            #  aws s3 cp "$ZIP_NAME" "s3://${CANARY_BUCKET}/${S3_KEY}"
            #  aws s3 cp "s3://${CANARY_BUCKET}/${S3_KEY}" /tmp/canary.zip
            #  unzip -l /tmp/canary.zip

          env:
            AWS_ACCESS_KEY_ID: $(aws_access_key)
            AWS_SECRET_ACCESS_KEY: $(aws_secret_key)
            AWS_DEFAULT_REGION: $(aws_region)
            CANARY_BUCKET: $(canary_bucket)
        - task: Bash@3
          displayName: Run Terraform
          inputs:
            targetType: inline
            script: |
              
              git config --global url."https://x-access-token:${GIT_PAT}@github.com/".insteadOf "https://github.com/"
              cd infrastructure/terraform/aws/$(env)/
              terraform init -input=false -backend-config="access_key=$AWS_ACCESS_KEY_ID" -backend-config="secret_key=$AWS_SECRET_ACCESS_KEY"
              terraform apply -input=false -auto-approve
              cd ../../../..
            failOnStderr: true
          env:
            AWS_ACCESS_KEY_ID: $(aws_access_key)
            AWS_SECRET_ACCESS_KEY: $(aws_secret_key)
            AWS_DEFAULT_REGION: $(aws_region)
            GIT_PAT: $(git_pat)

- stage: deploy
  displayName: Deploy
  jobs:
  - job: Deploy
    steps:
    - checkout: self
      submodules: true
      persistCredentials: true
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.10'
    - script: |
         pip install --upgrade pip; pip install requests
    - script: |
          python release/schedule.py
      displayName: Run schedule.py
      condition: eq(variables['RELEASE_BUILD'], 'true')
    - task: Bash@3
      displayName: Build and Push Image
      inputs:
        targetType: inline
        script: |
          aws synthetics update-canary \
          --region eu-west-1 \
          --name "site-health-canary" \
          --code "S3Bucket=${CANARY_BUCKET},S3Key="canaries/site-health-canary.zip",Handler=index.handler" \
          --runtime-version "syn-python-selenium-8.0"
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          CODEARTIFACT_REPO_URL=$(aws codeartifact get-repository-endpoint \
          --domain $(env) \
          --domain-owner $AWS_ACCOUNT_ID \
          --repository python \
          --format pypi \
          --region "$AWS_REGION" \
          --query repositoryEndpoint \
          --output text)
          CODEARTIFACT_REPO_HOST="${CODEARTIFACT_REPO_URL#https://}"
          CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
            --domain $(env) \
            --domain-owner $AWS_ACCOUNT_ID \
            --region "$AWS_REGION" \
            --query authorizationToken \
            --output text)
          
          docker build . \
            --build-arg CODEARTIFACT_REPO_HOST="$CODEARTIFACT_REPO_HOST" \
            --build-arg CODEARTIFACT_AUTH_TOKEN="$CODEARTIFACT_AUTH_TOKEN" \
            -t "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG"
          docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG"
        failOnStderr: false
      env:
        AWS_ACCESS_KEY_ID: $(aws_access_key)
        AWS_SECRET_ACCESS_KEY: $(aws_secret_key)
        AWS_REGION: $(aws_region)
        DEBUG: $(debug)
        OPENSEARCH_KEY: $(opensearch_key)
        OPENSEARCH_SECRET: $(opensearch_secret)
        AWS_ACCOUNT_ID: $(aws_account_id)
        IMAGE_NAME: $(image_name)
        IMAGE_TAG: $(image_tag)
        CANARY_BUCKET: $(canary_bucket)


    - template: templates/ecs-update-service.yml
  
      parameters:
        clusterName: $(image_name)
        serviceName: $(image_name)


  - job: DeployAPI
    steps:
      - template: templates/ecs-update-service.yml
        parameters:
          clusterName: $(image_name)
          serviceName: $(env)-api
          imageTag: $(image_tag)
          region: $(aws_region)