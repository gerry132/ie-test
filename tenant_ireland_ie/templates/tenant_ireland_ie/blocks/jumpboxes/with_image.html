<div class="col-lg-12 col-lg-12 col-lg-12 col-lg-12 jumpbox-with-image" style="background-image: url({{ image }});">
    <div class="inner-wrapper">
        {% if topic|default:None != '' and topic|default:None is not None %}
            <span class="label label-primary">{{ topic }}</span>
        {% endif %}
        <p>
            <a href="{{ url }}}">{{ link_text }}</a>
            {% if text|default:None != '' and text|default:None is not None %}
                <br />
                {{ text }}
            {% endif %}
        </p>
    </div>
</div>
