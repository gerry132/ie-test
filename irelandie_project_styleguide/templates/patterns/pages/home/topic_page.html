{% extends "patterns/hero_page.html" %}
{% load wagtailcore_tags i18n %}

{% block main %}
    <div class="wrapper wrapper--large wrapper--padding">   
        {% include_block page.body %}
    </div>

    <div class="section section--padding">
        {% include_block page.featured_articles %}
    </div>

    <div class="wrapper wrapper--large wrapper--padding">
        {{ page.articles }}
    </div>

    <div class="wrapper wrapper--large wrapper--padding">
        {% include_block page.embeds %}
    </div>

    <div class="section section--padding section--grey">
        <div class="wrapper wrapper--large wrapper--padding">
            {% include_block page.logo_cards %}
        </div>
    </div>
{% endblock %}
