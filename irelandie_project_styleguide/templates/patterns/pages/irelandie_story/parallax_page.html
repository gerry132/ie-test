{% extends "patterns/hero_page.html" %}
{% load util_tags wagtailcore_tags wagtailimages_tags static %}

{% block main %}
    {{ page.body }}
<script src="https://cdn.jsdelivr.net/npm/jarallax@2.2.1/dist/jarallax.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jarallax@2.2.1/dist/jarallax-video.min.js"></script>
<script>

document.addEventListener('DOMContentLoaded', function() {

    const blockTypes = [
      "ParallaxImageVideoBlock",
      "ParallaxYoutubeVimeoBlock",
      "ParallaxAdvancedRichTextBlock",
      "ParallaxLogocards",
      "ParallaxStoryPhotoGalleryBlock",
      "ParallaxTimelinePhotoGalleryBlock",
      "ParallaxLinkCardsBlock"
    ];

    let speakableBlocks = [];

    // Regular blocks
    blockTypes.forEach(type => {
      const blocks = document.querySelectorAll(`.block-${type}`);
      blocks.forEach(block => {
        if (block.querySelector('[data-speakable="true"]')) {
          speakableBlocks.push(block);
        }
      });
    });

    // DoubleFeature blocks
    const doubleFeatures = document.querySelectorAll('.double-feature--child');
    doubleFeatures.forEach(child => {
      if (child.querySelector('[data-speakable="true"]')) {
        speakableBlocks.push(child);
      }
    });

    // Sort in DOM order
    speakableBlocks.sort((a, b) => {
      return a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_PRECEDING ? 1 : -1;
    });

    // Assign data-index
    speakableBlocks.forEach((block, i) => {
      block.setAttribute('data-index', i + 1);
    });
    // Initialize Jarallax for each element with the 'jarallax' class
    jarallax(document.querySelectorAll('.jarallax'));

    const parallaxSections = document.querySelectorAll('.parallax-section');

    window.addEventListener('scroll', function() {
        const scrollY = window.scrollY;

        parallaxSections.forEach((section, index) => {
            const speed = parseFloat(section.getAttribute('data-speed'));
            const yPos = Math.max(0, (scrollY - section.offsetTop) * speed);

            section.style.transform = `translateY(${yPos}px)`;

            const credit = section.querySelector('.story__image-credit');
            if (credit) {
                credit.style.bottom = `${yPos}px`;
            }
        });
    });
});



</script>

{% endblock %}
