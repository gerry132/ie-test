{% extends "patterns/hero_page.html" %}
{% load util_tags wagtailcore_tags wagtailimages_tags static %}

{% block main %}
    {{ page.body }}
<script src="https://cdn.jsdelivr.net/npm/jarallax@2.2.1/dist/jarallax.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jarallax@2.2.1/dist/jarallax-video.min.js"></script>
<script>

document.addEventListener('DOMContentLoaded', function() {
    // Initialize Jarallax for each element with the 'jarallax' class
    jarallax(document.querySelectorAll('.jarallax'));

    const parallaxSections = document.querySelectorAll('.parallax-section');

    window.addEventListener('scroll', function() {
        const scrollY = window.scrollY;

        parallaxSections.forEach((section, index) => {
            const speed = parseFloat(section.getAttribute('data-speed'));
            const yPos = Math.max(0, (scrollY - section.offsetTop) * speed);

            section.style.transform = `translateY(${yPos}px)`;

            const credit = section.querySelector('.story__image-credit');
            if (credit) {
                credit.style.bottom = `${yPos}px`;
            }
        });
    });
});



</script>

{% endblock %}
