{% load static navigation_tags util_tags %}
<div class="wrapper wrapper--large wrapper--padding">
    <div class="wrapper wrapper--large travel-toc-table">
        <nav aria-label="Table of contents">
            <h2 class="visually-hidden">Contents</h2>
            <ul>
                {% for block in page.body %}
                    {% for val in block.value.accordions %}
                        <li class="toc-contents-number">
                            —<a class="toc-contents" href="#{{ val.value.title|slugify }}" aria-label="{{ val.value.title }}">
                                <span>{{ val.value.title }}</span>
                            </a>
                        </li>
                    {% endfor %}
                {% endfor %}
            </ul>
        </nav>
    </div>
</div>
