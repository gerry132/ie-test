<div class="form--elem">
    <div class="a-z-listing__filter__label__text">Choose country:</div>
    <select class="search-bar--travel-index" onchange="location = this.value; ">
        <option value="" name="popular_page" selected disabled hidden>-- Choose country --</option>
        {% for key, value in travel_pages.items %}
                  {% for p in value %}
                    <option value="{{p.url}}">{{p}}</option>

                    {% endfor %}
            {% endfor %}
        </select>
        </div>
        <div class="form--elem">
        <div class="a-z-listing__filter__label__text">Type country name:</div>

        <input class="form--input" type="text" id="cname" name="cname">
    </div>
    <div class="form--elem">
        <div class="a-z-listing__filter__label__text">Choose region:</div>
        <select class="search-bar--travel-index" id="region-selector">
            <option value="All" name="popular_page" selected>All</option>
                        <option value="Asia and Oceania">Asia and Oceania</option>
                        <option value="Caribbean">Caribbean</option>
                        <option value="Europe">Europe</option>
                        <option value="Middle East and North Africa">Middle East and North Africa</option>
                        <option value="North and Central America">North and Central America</option>
                        <option value="South America">South America</option>
                        <option value="Sub-Saharan Africa">Sub-Saharan Africa</option>
            </select>
            </div>
            <div class="form--contain" onclick="clearAllFilters()">
                <div class="vector--container">
                    <div class="close_vector"></div>
                </div>
                <div class="filter-text"><h3 class="form-clear">Clear all filters</h3></div>
            </div>
<div class="wrapper wrapper--large" style="margin-right: 20px;">
    <div class="a-z-listing__alphabet">
        <div class="a-z-listing__filter__label__text">Jump to</div>
