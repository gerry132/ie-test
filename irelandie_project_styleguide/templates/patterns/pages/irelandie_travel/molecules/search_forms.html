{% load static util_tags i18n %}
<div class="form--elem">
    <label for="destination-select" class="a-z-listing__filter__label__text">{% translate "Choose destination:" %}</label>
    <select id="destination-select" class="search-bar--travel-index" onchange="location = this.value; ">
        <option value="" name="popular_page" selected disabled hidden>{% translate "-- Choose destination --" %}</option>
        {% for key, value in travel_pages.items %}
                  {% for p in value %}
                        <option value="{{p.url}}">{{p}}</option>
                    {% endfor %}
            {% endfor %}
        </select>
        </div>
        <div class="form--elem">
        <label for="cname" class="a-z-listing__filter__label__text">{% translate "Type destination name:" %}</label>

        <input class="form--input" type="text" id="cname" name="cname">
    </div>
    <div class="form--elem">
        <label for="region-selector" class="a-z-listing__filter__label__text">{% translate "Choose region:" %}</label>
        <select class="search-bar--travel-index" id="region-selector">
            <option value="All" name="popular_page" selected>{% translate "All" %}</option>
            <option value="asia and oceania/áise agus an aigéine">{% translate "Asia and Oceania" %}</option>
            <option value="caribbean/sa mhuir chairib">{% translate "Caribbean" %}</option>
            <option value="europe/eoraip">{% translate "Europe" %}</option>
            <option value="middle east and north africa/meán-oirthear agus an afraic thuaidh">{% translate "Middle East and North Africa" %}</option>
            <option value="north and central america/thuaidh agus meiriceá láir">{% translate "North and Central America" %}</option>
            <option value="south america/meiriceá theas">{% translate "South America" %}</option>
            <option value="sub-saharan africa/afraic fho-shahárach">{% translate "Sub-Saharan Africa" %}</option>
        </select>
    </div>

            <div tabindex="0" class="form--contain" onclick="clearAllFilters()">
                <div class="vector--container">
                    <div class="close_vector"></div>
                </div>
                <div class="filter-text"><h3 class="form-clear">{% translate "Clear all filters" %}</h3></div>
            </div>
<div class="wrapper wrapper--large" style="margin-right: 20px;">
    <div class="a-z-listing__alphabet">
        <div class="a-z-listing__filter__label__text">{% translate "Jump to" %}</div>
        <ul class="a-z-listing__alphabet_letters">
            {% for letter, value in travel_pages.items %}
            {% if value %}
                <li class="a-z-listing__alphabet_letter"><a aria-label="{% trans 'Letter' %}" href="#{{ letter }}">{{ letter }}</a></li>
            {% endif %}
            {% endfor %}
        </ul>

    </div>
</div>
