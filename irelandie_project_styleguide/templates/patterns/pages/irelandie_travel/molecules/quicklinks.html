{% load i18n %}
<ul class="container--quick--link featured-blocks--eight">
    {% for link in page.quick_links %}
        <li>
            <a href="{{ link.value.url }}" aria-label="{% trans 'Quick link' %}" class="travel-buttons-country">
                <span class="quick--link--text">
                    {{link.value}}
                </span>
            </a>
        </li>
    {% endfor %}
</ul>
