{% load wagtailcore_tags wagtailimages_tags i18n %}

<a href="{{ job.url }}" aria-label="{{ job.title }}" class="link-box" tabindex="-1">
    <div class="link-box__content" tabindex="0">
        <div class="link-box__container" >
            <h3 class="link-box__heading heading--3">
                <span class="link-box__heading-text">{{ job.title }}</span>
            </h3>
           <div style="max-width:unset;" class="rich-text">
                {{ job.job_index_page_summary|richtext }}
            </div>
        </div>
        <button tabindex="-1" class="link-box__btn{% if job.job_index_page_summary %} link-box__title_subtitle{% else %} link-box__title{% endif %}" aria-label="{% trans 'Link box button' %}"></button>
    </div>
    <br>
    <div class="link-box__heading1 link-box__line"></div>
</a>
