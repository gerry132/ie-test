{% load wagtailcore_tags %}

<div class="accordions{% if value.background == 'dark' %} accordions--dark{% endif %}">
    <div class="wrapper wrapper--large wrapper--padding">
        {% if value.title %}
            <h2 class="heading heading--2 accordions__title">
                {{ value.title }}
            </h2>
        {% endif %}
        {% if value.summary %}
            <div class="accordions__summary">
                {{ value.summary }}
            </div>
        {% endif %}

        <div class="accordion__container">
            {% for accordion in value.accordions %}
                <div class="accordion" data-accordion>
                    <h2 class="accordion__header">
                        <button
                            id="question-{{ forloop.counter }}"
                            class="accordion__button"
                            data-accordion-question
                            aria-controls="answer-{{ forloop.counter }}"
                            aria-expanded="false">
                            <span class="accordion__title">
                                {{ accordion.value.title }}
                            </span>

                            {% include "patterns/atoms/icons/icon.html" with name="arrow" classname="accordion__icon" %}
                        </button>
                    </h2>
                    <div
                        id="answer-{{ forloop.counter }}"
                        data-accordion-answer
                        class="accordion__content"
                        aria-labelledby="question-{{ forloop.counter }}"
                        aria-hidden="true">
                        {{ accordion.value.content }}
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</div>
