{% load wagtailcore_tags %}
<nav aria-label="Secondary">
    {% for column in secondarynav %}
        <div class="secondary-nav__column">
            {% if column.heading %}
                <p class="heading--5">{{ value.heading }}</p>
            {% endif %}
            <ul class="secondary-nav">
                {% for item in column.links %}
                    <li class="secondary-nav__item">
                        {% include_block item with nav_type="secondary-nav" %}
                    </li>
                {% endfor %}
            </ul>
        </div>
    {% endfor %}
</nav>
