{% load i18n %}

<nav aria-label="Secondary">
     <ul class="primary-nav" data-primary-nav>
        {% for custom_link in customnav %}
            <li class="primary-nav__item">
                <a class="primary-nav__link" href="{{ item_url }}">
                    {% if custom_link.value.title %}
                        {{ custom_link.value.title }}
                    {% else %}
                        {{ custom_link.value.page.title }}
                    {% endif %}
                </a>
            </li>
        {% endfor %}
    </ul>
</nav>
