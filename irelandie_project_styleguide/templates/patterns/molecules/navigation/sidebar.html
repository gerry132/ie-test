{% load wagtailcore_tags i18n %}

{% if children %}
    <div class="sidebar">
        <div class="sidebar__inner">
            <h2>{% trans 'In this section' %}</h2>
            <ul>
                {% for child in children %}
                <li><a href="{% pageurl child %}">{{ child.title }}</a></li>
                {% endfor %}
            </ul>
        </div>
    </div>
{% endif %}
