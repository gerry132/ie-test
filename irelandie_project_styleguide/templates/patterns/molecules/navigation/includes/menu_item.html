{% load wagtailcore_tags %}
{% comment %} {% pageurl page as item_url %} {% endcomment %}
<a class="{{ nav_type }}__link" {% if has_children %}data-open-subnav{% endif %} href="{{ link_url }}" {% if has_children %}aria-haspopup="true" aria-expanded="false"{% endif %}>
    {{ link_title }}
    {% if has_children %}
        <span class="{{ nav_type }}__icon">
            {% include "patterns/atoms/icons/icon.html" with name="arrow" classname="primary-nav__svg" %}
        </span>
    {% endif %}
</a>
