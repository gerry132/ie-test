{% load wagtailcore_tags %}{% pageurl page as item_url %}
<a class="{{ nav_type }}__link"{% if has_children %} data-open-subnav{% endif %} href="{{ item_url }}"
    {% if has_children %} aria-haspopup="true" aria-expanded="false" {% endif %}
    >
    {{ title|default:page.title }} {% if overview_title %} {{ overview_title }}{% endif %}
    {% if has_children %}
        <span class="{{ nav_type }}__icon">
            {% include "patterns/atoms/icons/icon.html" with name="arrow" classname="primary-nav__svg" %}
        </span>
    {% endif %}
</a>
