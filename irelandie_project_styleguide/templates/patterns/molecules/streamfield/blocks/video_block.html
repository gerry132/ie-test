{% load i18n %}

<div class="wrapper wrapper--large wrapper--padding">
    <figure class="video-block">
        <video class="video-block__video" aria-label="{{ value.title }}" title="{{ value.title }}" autoplay loop muted data-video controls>
            <source src="{{ value.video.url }}" type="video/mp4">
            {% trans 'Your browser does not support the video tag.' %}
        </video>
    </figure>
</div>
