{% load i18n %}

<div class="streamfield">
    <figure class="video-block" aria-hidden="true">
        <video class="video-block__video" title="{{ value.title }}" autoplay loop muted data-video controls>
            <source src="{{ value.url }}" type="video/mp4">
            {% trans 'Your browser does not support the video tag.' %}
        </video>
    </figure>
</div>
