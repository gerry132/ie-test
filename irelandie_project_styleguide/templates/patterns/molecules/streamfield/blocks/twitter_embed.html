<div class="wrapper wrapper--large wrapping--padding">
    <div class="twitter-embed">
        <a class="twitter-timeline" {% if value.width %}data-width="{{ value.width }}"{% endif %} {% if value.height %}data-height="{{ value.height }}"{% endif %} href="https://twitter.com/{{ value.username }}?ref_src=twsrc%5Etfw">
            {% if value.title %}
                {{ value.title }}
            {% else %}
                Tweets by {{ value.username }}
            {% endif %}
        </a>
    </div>
</div>
