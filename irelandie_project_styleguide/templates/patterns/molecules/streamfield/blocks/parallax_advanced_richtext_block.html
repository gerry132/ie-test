{% load wagtailcore_tags i18n %}
<style>

    .rich-text.rich-text__content {
        padding-left: 20px;
        padding-right: 20px;
    }
</style>
<div class="parallax parallax-section jarallax text-parallax" id="jarallax3"{% if not double_feature %}  data-speed="0.2" {% endif %}>
    <div style="{% if value.background_color %} background-color: {{value.background_color}}; {% endif %}" class="jarallax-color"></div>

    <div class="rich-text rich-text__content theme--{{ value.link_button_theme|default:'standard' }}"
        style="text-align: {{value.text_alignment}}; --text-color: {{ value.text_color }};"
        {% if value.section_id %} id="{{value.section_id}}" {% endif %}>

        {% if value.heading %}
            <h2 class="story__heading heading--2">{{ value.heading }}</h2>
        {% endif %}
        {% if value.rich_text %}
            <div style="color: {{value.text_color}};" class="rich_text__summary">{{ value.rich_text }}</div>
        {% endif %}

        {% if buttons %}
          <div class="wrapper wrapper--large" style="padding-top: 15px; padding-bottom: 15px;">
            {% for button in buttons %}
              <a class="button_text"
                 href="{{ button.page.url|default:button.url }}">
                {{ button.message }}
              </a>
            {% endfor %}
          </div>
        {% endif %}
        {% if value.audio %}
            {{ value.audio|safe }}
        {% endif %}
    </div>
</div>
