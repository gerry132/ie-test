{% load wagtailimages_tags %}

<div class="streamfield">
    <figure class="image-block">
        {% if value.image_alt %}
                <div class="{% if value.image_credit %}image-block__credit_wrapper{% endif %}">
                    {% if value.image_credit %}
                            <button class="story__button-image-credit" data-image-credit role="button" aria-label="See the credit for this image">
                                <svg width="29" height="29" viewBox="0 0 29 29" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path fill-rule="evenodd" clip-rule="evenodd" d="M25.375 14.5C25.375 20.5061 20.5061 25.375 14.5 25.375C8.4939 25.375 3.625 20.5061 3.625 14.5C3.625 8.4939 8.4939 3.625 14.5 3.625C20.5061 3.625 25.375 8.4939 25.375 14.5ZM15.7083 9.66667C15.7083 10.334 15.1673 10.875 14.5 10.875C13.8327 10.875 13.2917 10.334 13.2917 9.66667C13.2917 8.99932 13.8327 8.45833 14.5 8.45833C15.1673 8.45833 15.7083 8.99932 15.7083 9.66667ZM15.5 20.5417V13.2917H13.5V20.5417H15.5Z" fill="white"/>
                                </svg>
                            </button>
                          <div class="story__image-credit">{{ value.image_credit }}</div>
                    {% endif %}
                    {% image value.image width-1000 class="image" loading="lazy" alt=value.image_alt %}
                </div>
        {% else %}
            <div class="{% if value.image_credit %}image-block__credit_wrapper{% endif %}">
                    {% if value.image_credit %}
                          <span class="story__image-credit">{{ value.image_credit }}</span>
                    {% endif %}
            {% image value.image width-1000 class="image" loading="lazy" alt=value.image.alt_default %}
            </div>
        {% endif %}
        {% if value.caption %}
            <figcaption class="image-block__caption">
                {{ value.caption }}
            </figcaption>
        {% endif %}
    </figure>
</div>
