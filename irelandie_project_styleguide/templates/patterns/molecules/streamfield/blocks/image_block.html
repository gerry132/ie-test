{% load wagtailimages_tags %}

<div class="streamfield">
    <figure class="image-block">
        {% image value.image width-1000 as block_image %}
        <img src="{{ block_image.url }}" alt="{{ value.image_alt }}" width="{{ block_image.width }}" height="{{ block_image.height }}" class="image" loading="lazy">
        <figcaption class="image-block__caption">
            {{ value.caption }}
        </figcaption>
    </figure>
</div>
