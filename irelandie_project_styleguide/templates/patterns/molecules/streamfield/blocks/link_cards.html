{% load wagtailcore_tags %}
<style>
    @media only screen and (max-width: 599px) {
        .padding {
            padding: 0px;
        }
        }
</style>
<div class="section section--padding padding" {% if value.is_speakable %} data-speakable="{{ block.block_type|slugify }}-{{ forloop.counter }}" {% endif %}>
    <div class="wrapper wrapper--large">
        {% if value.link_cards|length > 2 %}
        <div class="article-cards featured-blocks featured-blocks--three">
            {% for link_card in value.link_cards %}
                {% include_block link_card %}
             {% endfor %}
        </div>
        {% else %}
        <div class="article-cards featured-blocks featured-blocks--two">
            {% for link_card in value.link_cards %}
                {% include_block link_card %}
            {% endfor %}
        </div>
        {% endif %}
    </div>

</div>
