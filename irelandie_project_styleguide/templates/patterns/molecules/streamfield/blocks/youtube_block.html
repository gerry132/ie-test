{% if value.embedding_url %}
<div class="wrapper wrapper--large wrapper--padding">
    {% if value.slido_embed %}
        <div class="slido-embed">
            <div style="padding-bottom: 56.25%;" class="slido-embed__video responsive-object">
                <iframe
                    role="presentation"
                    width="100%"
                    height="420"
                    src="{{ value.embedding_url }}"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    frameborder="0"
                    allowfullscreen
                >
                </iframe>
            </div>
            <div class="slido-embed__slido">
                {{ value.slido_embed|safe }}
            </div>
        </div>
    {% else %}
        <div style="padding-bottom: 56.25%;" class="responsive-object">
            <iframe
                role="presentation"
                width="100%"
                height="420"
                src="{{ value.embedding_url }}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                frameborder="0"
                allowfullscreen
            >
            </iframe>
        </div>
    {% endif %}
</div>
{% endif %}
