{% if value.embedding_url %}
<div class="section section--padding">
<div class="wrapper wrapper--large wrapper--padding">
    {% if value.slido_embed %}
        <div class="slido-embed">
            <div style="padding-bottom: 56.25%;" class="slido-embed__video responsive-object">
                <iframe
                    title="Youtube video"
                    width="100%"
                    height="420"
                    src="{{ value.embedding_url }}"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    frameborder="0"
                    allowfullscreen
                    referrerpolicy="strict-origin-when-cross-origin"
                >
                </iframe>
            </div>
            <div class="slido-embed__slido">
                {{ value.slido_embed|safe }}
            </div>
        </div>
    {% else %}
    {% if value.youtube_size_alignment == 'large' %}
        <div style="padding-bottom: 56.25%; " class="responsive-object">
            <iframe
                title="Youtube video"
                width="100%"
                height="420"
                src="{{ value.embedding_url }}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                frameborder="0"
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
            >
            </iframe>
        </div>
    {% elif value.youtube_size_alignment == 'small' %}
    <div style="width: 50%; margin: 0px auto;">
         <div style="padding-bottom: 56.25%;" class="responsive-object">
            <iframe
                title="Youtube video"
                width="100%"
                height="420"
                src="{{ value.embedding_url }}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                frameborder="0"
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
            >
            </iframe>
        </div>
        </div>
    {% else %}
        <div style="margin-left: auto; margin-right: auto; max-width: 780px;">
         <div style="padding-bottom: 56.25%;" class="responsive-object">
            <iframe
                title="Youtube video"
                width="100%"
                height="420"
                src="{{ value.embedding_url }}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                frameborder="0"
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
            >
            </iframe>
        </div>
        </div>
    {% endif %}
    {% endif %}
</div>
</div>
{% endif %}
