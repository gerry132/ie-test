{% load wagtailcore_tags wagtailimages_tags %}
<style>

    @media only screen and (min-width: 1024px){
        .story__content {
            padding: 0 60px 0 0;
        }
    }
     @media only screen and (max-width: 1024px){
        .story__content {
            padding: 40px 0px;
        }
    }
</style>

<div class="story">
        <div class="document__container">
            <div class="document__content">
                {% if value.heading %}
                    <div class="pull_out_heading heading--2">{{ value.heading }}</div>
                {% endif %}
                {{ value.body }}
            </div>
            <div class="story__image_container">
                {% image value.document_image original alt=value.image_alt class="image" %}
                <div class="document__title">
                    {{ value.document_title }}
                </div>
                <div style="margin-top: auto;">
                    <a href="{{ value.document.url }}" style="padding-right: 20px;" target="_blank" rel="nofollow noreferrer" aria-labelledby="document-title">View</a>
                    <button type = "button" style="background: none!important; border: none; color: #004d46; cursor: pointer;" onclick = "startDownload('{{value.document.url}}', '{{value.document.url}}')"> Download </button>
                </div>
            </div>
        </div>
</div>

   <script>
      function startDownload(url, fileName) {
         fetch(url, { method: 'get', mode: 'no-cors', referrerPolicy: 'no-referrer' })
            .then(res => res.blob())
            .then(res => {
              const aElement = document.createElement('a');
              aElement.setAttribute('download', fileName);
              const href = URL.createObjectURL(res);
              aElement.href = href;
              // aElement.setAttribute('href', href);
              aElement.setAttribute('target', '_blank');
              aElement.click();
              URL.revokeObjectURL(href);
    });
      }
   </script>
