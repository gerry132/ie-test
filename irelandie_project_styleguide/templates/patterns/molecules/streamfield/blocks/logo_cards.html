{% load wagtailcore_tags %}

<div class="intro">
    <h2 class="intro__title">{{ value.title }}</h2>
    <div class="intro__description">{{ value.summary }}</div>
</div>

<div class="logo-cards featured-blocks featured-blocks--four">
    {% for card in value.cards %}
        {% include_block card %}
    {% endfor %}
</div>
