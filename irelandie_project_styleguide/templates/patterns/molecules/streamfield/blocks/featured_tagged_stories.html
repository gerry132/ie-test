{% load wagtailcore_tags wagtailimages_tags i18n %}

<div class="wrapper wrapper--large wrapper--padding">
    <div class="intro" style="max-width:1024px;">
        <h2 class="intro__title">{{ value.title }}</h2>
        <div class="intro__description">{{ value.summary|richtext }}</div>
    </div>

    <div class="featured-blocks featured-blocks--three">
        {% for article in value.taggedStories %}
            {% include_block article %}
        {% endfor %}
    </div>

</div>
