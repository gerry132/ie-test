{% load wagtailcore_tags %}
<div class="wrapper wrapper--large wrapper--padding">
<div class="intro" style="max-width:1024px;margin-bottom: 0;">
        <div class="intro__description">{% include_block value.richtext %}</div>
</div>

<div class="stats__grid">
    {% for stats in value.stats %}
    <div class="stats__border">
        {% include_block stats %}
    </div>
    {% endfor %}
</div>
</div>
