{% load wagtailcore_tags wagtailimages_tags i18n %}

<a href="{{ link_url }}" aria-label="{% trans 'card' %}" class="card">
    <div class="mini_link_image-container">
            {% with alt_text=value.image_alt|default:value.image.description %}
                {% image value.image original alt=alt_text %}
            {% endwith %}
    </div>

    <div class="mini_card__content">
        <div class="mini_card__title">
            {{ value.title }}
        </div>
    </div>
</a>
