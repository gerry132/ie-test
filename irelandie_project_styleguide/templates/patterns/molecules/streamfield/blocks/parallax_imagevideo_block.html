{% load wagtailcore_tags wagtailimages_tags i18n %}
<h1>{{value.image}}aaa</h1>
{% if value.image %}
        {% image value.image original as desktop_image %}
        <style>
        .gradient-overlay {
            content: '';
            background: linear-gradient(0deg,
                                    var(--linear-gradient, inherit) 0%,
                                    rgba(0, 0, 0, 0)
                                    {% if page.transparency %} {{page.transparency}}% {% else %}100% {% endif %});
            display: block;
            left: 0;
            position: absolute;
            height: 100%;
            width: 100%;
            top: 0;
            z-index: 1;
        }
            .rich-text.content h2,
            .rich-text.content h3,
            .rich-text.content h4 {
            color: var(--text-color);
            }


    </style>
    <div data-jarallax class="jarallax" id="jarallax1" data-speed="0.5">
        <div class="gradient-overlay" style="{% if value.gradient_image_video %}--linear-gradient: {{ value.gradient_image_video }} {% else %} black {% endif %}">
            <img class="img" src="{{ desktop_image.url }}" alt="{{ value.alt_text }}"></div>
            <div class="rich-text content" style="text-align: {{value.text_alignment}}; color: {{value.text_color}}; --text-color: {{value.text_color}};">
                <h2>{{ value.heading }}</h2>
                <p>{{ value.subtitle|richtext }}</p>
            </div>
    </div>
    <h1>{{value.image}}aafdasfdsafsdfsad</h1>
{% else %}
{% endif %}
