{% load wagtailcore_tags %}
<div class="rich-text">
    {% if value.paragraph_alignment == 'narrow' %}
        <div class="rich-text rich-text__narrow">
            <h3 class="story__heading heading--2">{{ value.heading }}</h3>
            {{ value.rich_text }}
        </div>
    {% else %}
        <h2 class="story__heading heading--2">{{ value.heading }}</h2>
        {{ value.rich_text }}
    {% endif %}
</div>
