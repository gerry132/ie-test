{% load wagtailcore_tags wagtailimages_tags i18n %}
{% load util_tags %}

{% for value in related_articles %}
<a href="{{ value.url }}" class="link-box">
    <div class="link-box__content">
        <div class="link-box__container">
            <h3 class="link-box__heading heading--3">{{ value.title }}</h3>
            {% format_date value.publication_date %}
           <div style="max-width:unset;" class="rich-text">
                {{ value.subtitle|richtext }}
            </div>
        </div>
        <button class="link-box__btn{% if value.subtitle %} link-box__title_subtitle{% else %} link-box__title{% endif %}" aria-label="Link box"></button>
    </div>
    <br>
    <div class="link-box__line"></div>
</a>

{% endfor %}
