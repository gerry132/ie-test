{% load wagtailcore_tags wagtailimages_tags i18n %}
<a href="{{ link_url }}" aria-label="{% trans 'link_box' %}" class="link-box" tabindex="-1">
    <div class="link-box__content" tabindex="0">
        <div class="link-box__container">
            <h3 class="link-box__heading heading--3">
                <span class="link-box__heading-text">{{ value.heading }}</span>
            </h3>
           <div style="max-width:unset;" class="rich-text">
                {{ value.introduction|richtext }}
            </div>
        </div>
        <button tabindex="-1" class="link-box__btn{% if value.introduction %} link-box__title_subtitle{% else %} link-box__title{% endif %}" aria-label="{% trans 'Link box button' %}"></button>
    </div>
    <br>
    <div class="link-box__line"></div>
</a>
