{% load wagtailcore_tags wagtailimages_tags i18n %}

<a href="{{ link_url }}" class="link-box">
    <div class="link-box__content">
        <div class="link-box__container">
            <h3 class="link-box__heading heading--3">{{ value.heading }}</h3>
           <div class="rich-text">
                {{ value.introduction|richtext }}
            </div>
        </div>
        <button class="link-box__btn"></button>
    </div>
    <div class="link-box__line"></div>
</a>
