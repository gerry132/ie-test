{% load wagtailcore_tags wagtailimages_tags i18n %}

<a href="{{ link_url }}" aria-label="{% trans 'card' %}" class="card">
    <div class="card__image-container">
        {% if value.image %}
            {% with alt_text=value.image_alt|default:value.image.description %}
                {% image value.image fill-400x200 alt=alt_text class="card__image" %}
            {% endwith %}
        {% endif %}
    </div>

    <div class="card__content">
        <h3 class="card__title">
            {{ value.title }}
        </h3>

        <p class="card__summary">
            {{ value.summary }}
        </p>
    </div>
</a>
